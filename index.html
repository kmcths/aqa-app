<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aquarian Answers - Tarot guidance for everyday choices">
    <title>Aquarian Answers - Daily Reading</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="app" class="app welcome-state">
        <div class="table">

            <!-- The deck: always the control that draws a card -->
            <button id="deck" class="deck" type="button" aria-label="Draw your card">
                <img src="assets/cards/back.png" alt="" class="deck-image">
            </button>

            <!-- The drawn card: flips from back to front as it is dealt -->
            <div class="card-slot">
                <div id="flipCard" class="flip-card is-hidden">
                    <div id="flipInner" class="flip-inner">
                        <img src="assets/cards/back.png" alt="" class="face face-back">
                        <img id="cardImage" src="" alt="" class="face face-front">
                    </div>
                </div>
            </div>

            <!-- The reading -->
            <section id="interpretation" class="interpretation is-hidden" aria-live="polite" aria-label="Card interpretation">
                <h2 id="cardName" class="card-name"></h2>
                <p id="cardOrientation" class="card-orientation"></p>
                <p id="interpretationText" class="interpretation-text"></p>
            </section>

        </div>
    </main>

    <script src="cards.js"></script>
    <script src="script.js"></script>
</body>
</html>
